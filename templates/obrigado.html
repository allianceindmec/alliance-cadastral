<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enviado — Alliance</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter',sans-serif; background: #f0f2f7; min-height: 100vh;
       display: flex; align-items: center; justify-content: center; padding: 24px; }
.card { background: white; border-radius: 20px; padding: 48px 32px; text-align: center;
        max-width: 420px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,.1); }
.icon { font-size: 72px; margin-bottom: 20px; }
h1 { font-size: 24px; font-weight: 800; color: #1a1f36; margin-bottom: 10px; }
p  { font-size: 15px; color: #6b7280; line-height: 1.6; }
.green { color: #16a34a; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🎉</div>
  <h1 class="green">Dados enviados!</h1>
  <p>Suas informações cadastrais foram atualizadas com sucesso.<br><br>
  O setor de RH irá analisar os dados enviados. Obrigado!</p>
</div>
</body>
</html>
